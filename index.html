<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>❌ Tic-Tac-Toe Game ⭕</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />

    <!-- Stlite Mountable CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.css"
    />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #0e1117;
      }
    </style>
  </head>
  <body>
    <!-- DOM Target where Streamlit mounts -->
    <div id="root"></div>

    <!-- Stlite Mountable Script -->
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.1/build/stlite.js"></script>
    <script>
      stlite.mount(
        {
          requirements: ["numpy"],
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "app.py",
            },
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
